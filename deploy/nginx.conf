# =========================================================================
# dotMDpritter — nginx site (TLS termination + reverse proxy)
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/dotmdpritter
#   sudo ln -s /etc/nginx/sites-available/dotmdpritter /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d notes.example.com
#
# certbot rewrites this file to add the certificate paths and redirect.
# =========================================================================

# Rate-limit zone for sign-in attempts (defence in depth — the app has its
# own limiter, but nginx sheds bursts before they reach node).
limit_req_zone $binary_remote_addr zone=dotmd_auth:10m rate=10r/m;

upstream dotmdpritter {
    server 127.0.0.1:4173;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    # Certbot uses this to finish the HTTP-01 challenge.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notes.example.com;

    # certbot --nginx fills these in.
    ssl_certificate     /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "same-origin" always;

    # Markdown documents can be large-ish; the app caps files at 8 MB.
    client_max_body_size 12m;

    # The app reads its CSRF header; the browser sets it, so no CORS needed.
    location / {
        proxy_pass         http://dotmdpritter;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The app uses this to set `Secure` on the session cookie.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Ssl   on;
        proxy_read_timeout 60s;
    }

    # Tighter limits on the account endpoints.
    location ~ ^/api/auth/(login|register|password)$ {
        limit_req zone=dotmd_auth burst=5 nodelay;
        proxy_pass         http://dotmdpritter;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Ssl   on;
    }

    # Never cache the API.
    location /api/ {
        proxy_pass         http://dotmdpritter;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "no-store" always;
    }
}
