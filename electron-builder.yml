# =========================================================================
# electron-builder configuration for the dotMDpritter desktop shell.
# Targets: Windows NSIS installer + portable exe (plus AppImage/dmg when
# built on the matching platform).
# =========================================================================

appId: com.dotmdpritter.app
productName: dotMDpritter
copyright: Released under the MIT licence.

directories:
  # Output lives inside the project (git-ignored; files are >100 MB so they
  # can never be pushed to GitHub anyway — releases carry the installers).
  # NOTE the Windows integrity-label gotcha (NOTES.md): this dist/ folder was
  # MOVED in from outside the workspace and therefore kept its clean (Medium)
  # integrity label. If dist/ is ever deleted and recreated here, it would
  # inherit the parent's Low label and the exes would crash at startup —
  # fix by moving dist/ out and back in (a move keeps labels) or by building
  # elsewhere and moving the output in.
  output: dist
  buildResources: build

# Allow-list: only the runtime files ship in the package. Tests, docs,
# screenshots, data/ and the deploy configs stay out of the installer —
# the same philosophy server.js applies to HTTP.
files:
  - desktop/**
  - server.js
  - server/**
  - index.html
  - assets/**
  - vendor/**
  - package.json
  - README.md
  - LICENSE
  # Test-scheduling helper used only on the dev machine.
  - '!desktop/smoke-run.ps1'

asar: true

win:
  icon: build/icon.png        # converted to .ico automatically
  target:
    - target: nsis
    - target: portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: dotMDpritter
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}

linux:
  icon: build/icon.png
  category: Office
  target:
    - AppImage

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  target:
    - dmg
